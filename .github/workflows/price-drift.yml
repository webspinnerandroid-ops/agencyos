name: Price Drift Check

# Nightly guard: flags any plan or hub whose landing-page display price has
# drifted from its active Stripe monthly price (or lost its Stripe product),
# so marketing copy can never silently diverge from what checkout charges.
# Mirrors scripts/check-price-drift.cjs, which reuses the exact resolution
# logic the page builder and landing page use (src/lib/stripe-pricing.ts).

on:
  schedule:
    # 03:17 UTC every day (17-minute offset avoids top-of-hour contention)
    - cron: "17 3 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

env:
  NODE_VERSION: "24"

jobs:
  drift:
    name: Check plan/hub price drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for price drift vs live Stripe
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Optional Slack/Discord incoming webhook URL; when set, the result
          # summary is posted there so failures are noticed without watching
          # the Actions tab. Add it at Settings > Secrets and variables.
          PRICE_DRIFT_WEBHOOK_URL: ${{ secrets.PRICE_DRIFT_WEBHOOK_URL }}
        run: node scripts/check-price-drift.cjs
